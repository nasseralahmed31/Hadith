<style>

.an>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.an>*:nth-child(2),.an #res>*:nth-child(2){animation-delay:.06s}.an>*:nth-child(3),.an #res>*:nth-child(3){animation-delay:.12s}.an>*:nth-child(4),.an #res>*:nth-child(4){animation-delay:.18s}.an>*:nth-child(5),.an #res>*:nth-child(5){animation-delay:.24s}.an>*:nth-child(n+6){animation-delay:.3s}

.mt{color:var(--mu);font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

h3{margin:18px 0 6px;font-size:16px;color:var(--gd)}
.pg{height:8px;background:rgba(255,255,255,.15);border-radius:8px;margin-top:12px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--gd),#ecd391);border-radius:8px;transition:width .8s}
.bars{display:flex;gap:6px;align-items:flex-end;justify-content:space-around;height:120px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:11px;color:var(--mu)}
.bar i{width:20px;background:linear-gradient(var(--gd),var(--ac));border-radius:8px;min-height:3px;display:block}
nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:460px;height:70px;display:flex;background:var(--card);border:1px solid var(--gd);border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:6;padding:6px}

.pill{position:absolute;top:6px;bottom:6px;width:calc((100% - 12px)/5);right:6px;background:var(--ac);border-radius:22px;box-shadow:0 4px 14px rgba(15,76,58,.45);transition:right .5s cubic-bezier(.34,1.3,.5,1)}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;align-items:flex-end;justify-content:center;animation:fo .25s}
.bx{background:var(--card);color:var(--tx);border-radius:26px 26px 0 0;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto;border-top:2px solid var(--gd);animation:su .4s var(--sp)}
.bx .btn,.bx .chip{width:100%;margin:5px 0;text-align:start}
.w{display:inline-block;border-bottom:2px dashed var(--gd);min-width:46px;text-align:center;color:transparent;cursor:pointer;user-select:none;transition:color .3s}.w.s{color:var(--tx);border-color:transparent}
#ts{position:fixed;bottom:104px;left:50%;transform:translate(-50%,16px);background:var(--ac);color:#fff;padding:10px 20px;border-radius:22px;opacity:0;transition:.35s var(--sp);z-index:40;pointer-events:none}#ts.show{opacity:1;transform:translate(-50%,0)}
</style></head>
<body><div class="top"><div><h1>📖 أحاديث</h1><small id="gr"></small></div><button class="ic" id="th">🌙</button></div>

<script type="module">

else if(tab=='saved'){if(fsel&&!C[fsel])fsel='';const ids=fsel?C[fsel]:fav,a=H.filter(h=>ids.includes(h.id));
m.innerHTML=`<div class="chips"><button class="chip ${fsel?'':'on'}" data-a="fs" data-s="">❤️ المفضلة (${fav.length})</button>${Object.keys(C).map(n=>`<button class="chip ${fsel==n?'on':''}" data-a="fs" data-s="${E(n)}">${E(n)} (${C[n].length})</button>`).join('')}<button class="chip" data-a="nc0">＋ مجموعة</button></div>${fsel?`<div class="row"><button class="btn o" data-a="dc">حذف المجموعة</button></div>`:''}${list(a,'لا شيء هنا بعد')}`}
else if(tab=='mem'){const a=H.filter(h=>mem.includes(h.id)),p=H.length?Math.round(a.length/H.length*100):0;
m.innerHTML=`<div class="hero" style="padding:18px"><div class="lb">🧠 حفظتَ ${a.length} من ${H.length} حديث (${p}%)</div><div class="pg"><i style="width:${p}%"></i></div></div>${list(a,'لم تحفظ أحاديث بعد. اضغط «حفظته» على أي حديث حفظتَه.')}`}
else{const[w,wa]=week(),mx=Math.max(1,...wa.map(x=>x[1])),pre=td().slice(0,7),mo=Object.entries(L).filter(([k])=>k.startsWith(pre)).reduce((s,[,v])=>s+v.length,0),tot=Object.values(L).reduce((s,v)=>s+v.length,0);
m.innerHTML=`<h3>📊 إحصائيات القراءة</h3><div class="st"><div><b>${streak()}</b>يوم متتالٍ</div><div><b>${w}</b>هذا الأسبوع</div><div><b>${mo}</b>هذا الشهر</div></div><div class="card"><div class="bars">${wa.map(([l,c])=>`<div class="bar"><span>${c}</span><i style="height:${c/mx*80}px"></i><span>${l}</span></div>`).join('')}</div><div class="mt" style="margin-top:10px">إجمالي القراءات: ${tot} · المصادر: ${new Set(H.map(h=>h.source)).size} · الرواة: ${new Set(H.map(h=>h.narrator)).size}</div></div>
<h3>⏰ التذكيرات</h3><div class="card">${window.__LN?`<label><input type="checkbox" id="ro" ${rm.on?'checked':''} style="width:auto"> تفعيل التذكيرات اليومية</label><p class="mt">عدد التذكيرات (1 إلى 10)</p><input id="rn" type="number" min="1" max="10" value="${rm.n}"><p class="mt">من الساعة</p><input id="rf" type="time" value="${rm.from}"><p class="mt">إلى الساعة</p><input id="rt" type="time" value="${rm.to}"><p class="mt">يختار التطبيق الحديث، والضغط على الإشعار يفتحه مباشرة.</p><button class="btn" data-a="rsv">حفظ وجدولة</button>`:'<p class="mt">التذكيرات تعمل في تطبيق الأندرويد (APK) فقط.</p>'}</div>
<h3>🎨 المظهر</h3><div class="card"><div class="row"><button class="btn o" data-a="tt">🌗 تبديل الوضع</button><button class="btn o" data-a="fz" data-d="-1">أ −</button><button class="btn o" data-a="fz" data-d="1">أ +</button></div></div>
<h3>🔐 المشرف</h3>${U?`<div class="card"><textarea id="t" rows="5" placeholder="الحديث / الراوي / المصدر"></textarea><input id="g2" placeholder="درجة الحديث (اختياري)"><input id="p" placeholder="الموضوع (اختياري)"><div class="row"><button class="btn" data-a="add">إضافة حديث</button><button class="btn o" data-a="out">خروج</button></div></div>`:`<div class="card"><input id="em" type="email" placeholder="البريد"><input id="pw" type="password" placeholder="كلمة المرور"><button class="btn" data-a="in">دخول</button></div>`}`}}
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;res()}});
document.addEventListener('click',async e=>{
const n=e.target.closest('[data-nav]');if(n){if(tab!=n.dataset.nav){tab=n.dataset.nav;view(true);scrollTo({top:0,behavior:'smooth'})}return}
if(e.target.id=='md'){close();return}
const b=e.target.closest('[data-a]');if(!b)return;
const a=b.dataset.a,i=b.dataset.i,h=H.find(x=>x.id==i),D=+b.dataset.d;
switch(a){
case'f':fav=fav.includes(i)?fav.filter(x=>x!=i):[...fav,i];S('fav',fav);view();pop('f',i);break;
case'mm':mem=mem.includes(i)?mem.filter(x=>x!=i):[...mem,i];S('mem',mem);view();pop('mm',i);toast(mem.includes(i)?'أُضيف إلى حفظتها 🧠':'أُزيل من حفظتها');break;
case'ok':markRead(i);view();pop('ok',i);break;
case'c':if(h){cp(`${h.text}\n\nالراوي: ${h.narrator}\nالمصدر: ${h.source}`);b.textContent='✓';b.classList.add('pop','on');setTimeout(()=>{b.textContent='📋';b.classList.remove('pop','on')},1300);toast('تم نسخ الحديث مع الراوي والمصدر')}break;
case'r':if(H.length){rnd=H[Math.floor(Math.random()*H.length)];view(true)}break;
case'g':grp=b.dataset.s;val='';view(true);break;
case'v':val=b.dataset.s;view(true);break;
case'fs':fsel=b.dataset.s;view(true);break;
case'sh':sheet(i);break;
case'd':ask('حذف هذا الحديث لجميع المستخدمين؟',()=>deleteDoc(doc(db,'hadiths',i)));break;
case'ed':if(h)modal(`<h3>تعديل الحديث</h3><textarea id="e1" rows="5">${E(h.text)}</textarea><input id="e2" value="${E(h.narrator)}" placeholder="الراوي"><input id="e3" value="${E(h.source)}" placeholder="المصدر"><input id="e4" value="${E(h.grade)}" placeholder="الدرجة"><input id="e5" value="${E(h.topic)}" placeholder="الموضوع"><button class="btn" data-a="es" data-i="${i}">حفظ</button><button class="btn o" data-a="x">إلغاء</button>`);break;
case'es':try{await updateDoc(doc(db,'hadiths',i),{text:$('#e1').value.trim(),narrator:$('#e2').value.trim(),source:$('#e3').value.trim(),grade:$('#e4').value.trim(),topic:$('#e5').value.trim()});close();toast('تم الحفظ ✓')}catch{toast('تعذّر الحفظ')}break;
case'in':signInWithEmailAndPassword(au,$('#em').value,$('#pw').value).catch(()=>toast('بيانات الدخول غير صحيحة'));break;
case'out':signOut(au);break;
case'add':{const p=$('#t').value.split('/').map(x=>x.trim()),source=p.pop(),narrator=p.pop(),text=p.join(' / ');
if(!text||!narrator||!source){toast('اكتب: الحديث / الراوي / المصدر');break}
try{await addDoc(collection(db,'hadiths'),{text,narrator,source,grade:$('#g2').value.trim(),topic:$('#p').value.trim(),createdAt:serverTimestamp()});view();toast('تمت الإضافة ✓')}catch{toast('تعذّرت الإضافة')}break}
case'fz':rs.s=Math.min(34,Math.max(16,rs.s+D));S('rs',rs);document.documentElement.style.setProperty('--fs',rs.s+'px');toast('حجم خط الأحاديث: '+rs.s);break;
case'cl':colModal(i);break;
case'tc':{const c=b.dataset.c;C[c]=C[c]||[];C[c]=C[c].includes(i)?C[c].filter(x=>x!=i):[...C[c],i];S('cols',C);colModal(i);view();break}
case'nc':{const name=$('#cn').value.trim();if(!name)break;C[name]=C[name]||[];if(i&&!C[name].includes(i))C[name].push(i);S('cols',C);if(i)colModal(i);else close();view();break}
case'nc0':modal(`<h3>مجموعة جديدة</h3><input id="cn" placeholder="مثل: أحاديث الأخلاق"><button class="btn" data-a="nc" data-i="">إنشاء</button><button class="btn o" data-a="x">إلغاء</button>`);break;
case'dc':ask('حذف المجموعة «'+E(fsel)+'»؟ (لن تُحذف الأحاديث)',()=>{delete C[fsel];S('cols',C);fsel='';view(true)});break;
case'ts':if(h)startTs(h);break;
case'rv':TS.rev[b.dataset.k]=!TS.rev[b.dataset.k];tsR();break;
case'tr':startTs(TS.h);break;
case'ta':TS.rev=Object.fromEntries(TS.hide.map((_,k)=>[k,true]));tsR();break;
case'yes':{close();if(yes){const f=yes;yes=null;f()}break}
case'x':close();break;
case'rsv':rm={on:$('#ro').checked,n:Math.min(10,Math.max(1,+$('#rn').value||1)),from:$('#rf').value||'08:00',to:$('#rt').value||'20:00'};S('rm',rm);await sched();toast(rm.on?'تمت جدولة التذكيرات ✓':'أُوقفت التذكيرات');break;
case'tt':$('#th').click();break;
}});
$('#th').onclick=()=>{const d=document.documentElement.dataset.t=='d'?'':'d';document.documentElement.dataset.t=d;localStorage.theme=d};
document.documentElement.dataset.t=localStorage.theme??'d';
onAuthStateChanged(au,u=>{U=u;view()});
onSnapshot(query(collection(db,'hadiths'),orderBy('createdAt','desc')),s=>{H=s.docs.map(d=>({id:d.id,...d.data()}));N={};H.forEach((h,i)=>N[h.id]=H.length-i);
if(!document.activeElement||!/INPUT|TEXTAREA/.test(document.activeElement.tagName))view();
if(PN){const id=PN;PN=null;openH(id)}sched()});
view(true);
</script></body></html>

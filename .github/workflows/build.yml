name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          npm install
          npm install --no-save @fontsource/cairo @fontsource/amiri @fontsource/scheherazade-new @fontsource/noto-naskh-arabic @capacitor/assets

      - name: Build web files
        run: node build.mjs

      - name: Add Android
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon
        continue-on-error: true
        run: |
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon-only.png
          npx capacitor-assets generate --android --iconBackgroundColor '#0a2a20' --iconBackgroundColorDark '#0a2a20'

      - name: Add permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hadith-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
